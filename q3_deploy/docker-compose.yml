name: gekko-intern
services:
  api:
    build:
      context: ..
      dockerfile: q3_deploy/Dockerfile
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/app.db}
      OCR_URL: ${OCR_URL:-http://mock_ocr:9100/ocr/parse}
      ONBOARDING_URL: ${ONBOARDING_URL:-http://mock_onboarding:9200/ingest}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-2}
      RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-5}
      RETRY_BACKOFF: ${RETRY_BACKOFF:-0.2}
    volumes:
      - app_data:/data
    depends_on:
      mock_ocr:
        condition: service_healthy
      mock_onboarding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  mock_ocr:
    build: ../mock_ocr
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/online', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  mock_onboarding:
    build: ../mock_onboarding
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/online', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      mock_ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  app_data:
