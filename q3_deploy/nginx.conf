server {
    listen 80;
    # 5 MiB application file limit plus multipart framing overhead.
    client_max_body_size 6m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    location /api/ {
        proxy_pass http://api:8000;
    }

    location /ocr/ {
        # No trailing URI: /ocr/parse must be preserved upstream.
        proxy_pass http://mock_ocr:9100;
    }
}
